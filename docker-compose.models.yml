services:
  llm:
    image: vllm/vllm-openai:latest
    profiles: ["models", "llm"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./services/models/llm/qwen3-32b-fp8:/models/core:ro
      - ./services/hf-cache:/root/.cache/huggingface
    command: >
      --model /models/core
      --host 0.0.0.0
      --port 8000
      --served-model-name ${FRIDAY_MODEL_NAME:-Lexi}
      --max-model-len 32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - friday_net

  stt:
    image: python:3.11-slim
    profiles: ["models", "voice", "stt"]
    command: >
      bash -lc "echo 'STT scaffold (disabled until implemented)' && sleep infinity"
    networks:
      - friday_net

  tts:
    image: python:3.11-slim
    profiles: ["models", "voice", "tts"]
    command: >
      bash -lc "echo 'TTS scaffold (disabled until implemented)' && sleep infinity"
    networks:
      - friday_net

  vision:
    image: vllm/vllm-openai:latest
    profiles: ["models", "vision"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./services/models/vlm/qwen3-vl-32b-fp8:/models/vlm:ro
      - ./services/hf-cache:/root/.cache/huggingface
    command: >
      --model /models/vlm
      --host 0.0.0.0
      --port 8000
      --served-model-name friday-vlm
      --max-model-len 32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - friday_net

  avatar:
    image: node:20-slim
    profiles: ["models", "avatar"]
    working_dir: /app
    volumes:
      - ./services/avatar:/app
    command: >
      bash -lc "echo 'Avatar service scaffold (disabled until implemented)' && sleep infinity"
    networks:
      - friday_net
