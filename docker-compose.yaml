services:
  backend:
    build: .
    ports:
      - "${FRIDAY_API_PORT:-9001}:9001"
    environment:
      FRIDAY_API_PORT: "${FRIDAY_API_PORT:-9001}"
      FRIDAY_LLM_ENABLED: "${FRIDAY_LLM_ENABLED:-0}"
      FRIDAY_PROMPT_PROFILE: "${FRIDAY_PROMPT_PROFILE:-friday_exec}"
      FRIDAY_MODEL_CLASS: "${FRIDAY_MODEL_CLASS:-30b}"
      FRIDAY_STT_ENABLED: "${FRIDAY_STT_ENABLED:-0}"
      FRIDAY_TTS_ENABLED: "${FRIDAY_TTS_ENABLED:-0}"
      FRIDAY_VISION_ENABLED: "${FRIDAY_VISION_ENABLED:-0}"
      FRIDAY_GESTURE_ENABLED: "${FRIDAY_GESTURE_ENABLED:-0}"
      FRIDAY_AVATAR_ENABLED: "${FRIDAY_AVATAR_ENABLED:-0}"
      FRIDAY_JOBS_ENABLED: "${FRIDAY_JOBS_ENABLED:-1}"
      FRIDAY_TOOLS_ENABLED: "${FRIDAY_TOOLS_ENABLED:-0}"
      FRIDAY_TOOLS_REQUIRE_CONFIRM: "${FRIDAY_TOOLS_REQUIRE_CONFIRM:-1}"
      FRIDAY_DEBUG_TOOL_ERRORS: "${FRIDAY_DEBUG_TOOL_ERRORS:-0}"
      FRIDAY_TRUST_MODE: "${FRIDAY_TRUST_MODE:-strict}"
      FRIDAY_TRUST_SAFE_TOOLS: "${FRIDAY_TRUST_SAFE_TOOLS:-list_facts,search_local_logs}"
      FRIDAY_DEBUG_APIS_ENABLED: "${FRIDAY_DEBUG_APIS_ENABLED:-0}"
      FRIDAY_QUEUE_BACKEND: "${FRIDAY_QUEUE_BACKEND:-memory}"
      REDIS_URL: "${REDIS_URL:-}"
      FRIDAY_MEMORY_PERSIST_ENABLED: "${FRIDAY_MEMORY_PERSIST_ENABLED:-0}"
      FRIDAY_MEMORY_VECTOR_ENABLED: "${FRIDAY_MEMORY_VECTOR_ENABLED:-0}"
      FRIDAY_MEMORY_FACTS_ENABLED: "${FRIDAY_MEMORY_FACTS_ENABLED:-0}"
      FRIDAY_MEMORY_SUMMARIES_ENABLED: "${FRIDAY_MEMORY_SUMMARIES_ENABLED:-0}"
      FRIDAY_MEMORY_CONSOLIDATION_ENABLED: "${FRIDAY_MEMORY_CONSOLIDATION_ENABLED:-0}"
      FRIDAY_MEMORY_MAX_FACTS: "${FRIDAY_MEMORY_MAX_FACTS:-500}"
      FRIDAY_MEMORY_FACTS_RETRIEVAL_LIMIT: "${FRIDAY_MEMORY_FACTS_RETRIEVAL_LIMIT:-10}"
      FRIDAY_MEMORY_SUMMARY_RETRIEVAL_LIMIT: "${FRIDAY_MEMORY_SUMMARY_RETRIEVAL_LIMIT:-5}"
      FRIDAY_MEMORY_SUMMARY_EVERY_N_TURNS: "${FRIDAY_MEMORY_SUMMARY_EVERY_N_TURNS:-20}"
      FRIDAY_EMOTION_LITE_ENABLED: "${FRIDAY_EMOTION_LITE_ENABLED:-1}"
      FRIDAY_DATA_DIR: "${FRIDAY_DATA_DIR:-/data}"
      FRIDAY_CONTEXT_TURNS: "${FRIDAY_CONTEXT_TURNS:-20}"
      FRIDAY_MODEL_PATH: "${FRIDAY_MODEL_PATH:-}"
      FRIDAY_MODEL_NAME: "${FRIDAY_MODEL_NAME:-friday}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      STT_BASE_URL: "${STT_BASE_URL:-}"
      TTS_BASE_URL: "${TTS_BASE_URL:-}"
      VISION_BASE_URL: "${VISION_BASE_URL:-}"
      AVATAR_BASE_URL: "${AVATAR_BASE_URL:-}"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/healthz"]
      interval: 10s
      timeout: 2s
      retries: 5
    networks:
      - friday_net

networks:
  friday_net:
    driver: bridge
