name: Dependency security refresh

on:
  push:
    branches:
      - security/harden-secrets-and-dependencies-2026-08-22

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-secrets-and-dependencies-2026-08-22
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Refresh root lockfile with non-breaking security fixes
        run: npm audit fix --package-lock-only
      - name: Refresh frontend lockfile with non-breaking security fixes
        working-directory: frontend
        run: npm audit fix --package-lock-only
      - name: Verify install and frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json frontend/package-lock.json
          git commit -m "security: refresh vulnerable npm dependencies"
          git push
