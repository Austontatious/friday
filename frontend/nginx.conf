# Use Docker's embedded DNS resolver so upstream hostnames are
# re-resolved on every connection rather than cached at startup.
# This prevents 502s caused by stale IPs when friday-backend restarts.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets + SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # API reverse proxy — set $upstream as a variable so nginx is forced to
  # re-resolve the hostname via the resolver above on every request,
  # preventing stale IP caches when the backend container restarts.
  # $request_uri includes the full path+query so the /api/ prefix is preserved.
  location /api/ {
    set $upstream http://friday-backend:9001;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # health passthrough
  location /healthz {
    set $upstream http://friday-backend:9001;
    proxy_pass $upstream/healthz;
  }
}
